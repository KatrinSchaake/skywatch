# Server-Port (Standard: 8080)
server.port=8080

# Anwendungsname
spring.application.name=skywatch

# JSON hübsch formatiert ausgeben
spring.jackson.serialization.indent-output=true

#H2-Datenbank (in-file) - Password niemals Klartext
spring.datasource.url=jdbc:h2:file:/tmp/skywatchDB
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=
spring.datasource.password=

#Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#H2-Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger UI Pfad (Standard: /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# Swagger UI nach HTTP-Methoden gruppieren und sortieren
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# in Priduktion deaktivieren
# dpringdoc.api-docs.enabled=false
# springdoc.swagger-ui.enabled=false

# External NASA API Setting {NASA_API_KEY kann als Umgebungsvariable gesetzt werden, ansonsten default DEMO_KEY}
nasa.api.base-url=https://api.nasa.gov
nasa.api.key=${NASA_API_KEY:DEMO_KEY}
nasa.api.connect-timeout-ms=2000
nasa.api.read-timeout-ms=50000